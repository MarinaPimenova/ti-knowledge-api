name: CI workflow

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21 and cache Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build project
        run: |
          ./gradlew --no-daemon build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/main'
        with:
          name: app-jar
          path: build/libs/*.jar

  publish:
    name: Build image & Publish
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ci-build'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download jar artifact
        uses: actions/download-artifact@v6
        with:
          name: app-jar
          path: build/libs

      - name: Lowercase repository name for image tag
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ secrets.GH_USERNAME }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/mnpimenov/ti-knowledge-gitops.git

          cd ti-knowledge-gitops

          sed -i \
            "s|image: ghcr.io/marinapimenova/ti-knowledge-api:.*|image: ghcr.io/marinapimenova/ti-knowledge-api:${IMAGE_TAG}|" \
            k8s/dev/ti-knowledge-api/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/dev/ti-knowledge-api/deployment.yaml
          git commit -m "Deploy ti-knowledge-api ${IMAGE_TAG}"
          git push
